<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>콜리지 놀이</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/characters.css">
  <link rel="stylesheet" href="./css/modals.css">
  <link rel="stylesheet" href="./css/worldview.css">
</head>
<body>
  <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-spinner" aria-hidden="true"></div>
      <div class="loading-title">불러오는 중...</div>
      <div id="loading-message" class="loading-message">잠시만 기다려 주세요</div>
    </div>
  </div>

  <script>
    // 모듈 로딩이 실패하면 boot()이 실행되지 않아 로딩창이 그대로 남습니다.
    // 그 경우 원인을 로딩창에 그대로 띄웁니다.
    (function () {
      var message = document.getElementById('loading-message');
      var initial = message ? message.textContent : '';

      function report(text) {
        console.error('[boot]', text);
        if (message) message.textContent = text;
      }

      window.addEventListener('error', function (event) {
        if (event.target && event.target.tagName === 'SCRIPT') {
          report('스크립트를 불러오지 못했습니다: ' + (event.target.src || ''));
        } else if (event.message) {
          report(event.message);
        }
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        report(String((reason && reason.message) || reason || '알 수 없는 오류'));
      });

      setTimeout(function () {
        var overlay = document.getElementById('loading-overlay');
        if (!overlay || overlay.classList.contains('is-hidden')) return;
        if (message && message.textContent === initial) {
          report('불러오기가 끝나지 않았습니다. Ctrl+Shift+R 로 강력 새로고침해 보시고, 그래도 같으면 F12 콘솔의 빨간 오류를 확인해 주세요.');
        }
      }, 10000);
    })();
  </script>

  <main class="app-shell">
    <div class="layout-stage">
      <section class="worldview-bar" id="worldview-bar" aria-label="세계관">
        <button id="worldview-list-btn" class="worldview-icon-btn" type="button" title="세계관 목록" aria-label="세계관 목록">≡</button>
        <div class="worldview-viewport" id="worldview-viewport">
          <div class="worldview-track" id="worldview-track"></div>
        </div>
        <button id="worldview-add-btn" class="worldview-icon-btn" type="button" title="세계관 추가" aria-label="세계관 추가">+</button>
      </section>

      <section class="shimeji-section" aria-label="캐릭터">
      <div id="cole-card" class="character-side-card">
        <div id="shimeji-cole" class="shimeji-avatar" title="콜" role="button" tabindex="0" aria-label="콜">
          <img id="img-cole" alt="콜">
        </div>
        <div class="card-btn-group">
          <button id="list-btn-cole" class="action-icon-btn" type="button" aria-label="콜 대사 목록">≡</button>
          <button id="btn-cole" class="action-icon-btn" type="button" title="대사 추가" aria-label="콜 대사 추가">+</button>
        </div>
      </div>

      <div class="speech-bubble-container">
        <div id="initial-guide-bubble" class="guide-bubble">캐릭터와 ≡ + 를<br>클릭해보세요.<br><br>아이템은<br>클릭과 드래그를<br>할 수 있습니다.</div>
        <div class="speech-bubble-wrapper">
          <div id="bubble-cole" class="speech-bubble-box"></div>
        </div>
        <div class="speech-bubble-wrapper">
          <div id="bubble-ellie" class="speech-bubble-box"></div>
        </div>
      </div>

      <div id="ellie-card" class="character-side-card">
        <div id="shimeji-ellie" class="shimeji-avatar" title="엘리" role="button" tabindex="0" aria-label="엘리">
          <img id="img-ellie" alt="엘리">
        </div>
        <div class="card-btn-group">
          <button id="list-btn-ellie" class="action-icon-btn" type="button" aria-label="엘리 대사 목록">≡</button>
          <button id="btn-ellie" class="action-icon-btn" type="button" title="대사 추가" aria-label="엘리 대사 추가">+</button>
        </div>
      </div>
    </section>

      <section class="item-container" id="item-container" aria-label="아이템">
      <button class="item-btn" type="button" draggable="true" data-item-id="dagger" title="단검" aria-label="단검">
        <img alt="단검">
      </button>
      <button class="item-btn" type="button" draggable="true" data-item-id="cocoa" title="코코아" aria-label="코코아">
        <img alt="코코아">
      </button>
      <button class="item-btn" type="button" draggable="true" data-item-id="heart" title="심장" aria-label="심장">
        <img alt="심장">
      </button>
      <button class="item-btn" type="button" draggable="true" data-item-id="gold" title="금화" aria-label="금화">
        <img alt="금화">
      </button>
      </section>
    </div>
  </main>

  <div id="quote-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <span id="modal-title">≡</span>
        <div class="modal-header-btns">
          <button id="expression-manage-btn" class="header-action-btn" type="button">표정</button>
          <button id="modal-close-btn" class="modal-close-btn" type="button" aria-label="닫기">✕</button>
        </div>
      </div>
      <ul id="modal-quote-list" class="modal-body"></ul>
    </div>
  </div>

  <div id="quote-add-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card modal-card-short" role="dialog" aria-modal="true" aria-labelledby="quote-add-modal-title">
      <div class="modal-header">
        <span id="quote-add-modal-title">대사 추가</span>
        <div class="modal-header-btns">
          <label class="checkbox-group"><input type="checkbox" id="quote-add-item-checkbox"> 아이템</label>
          <button id="quote-add-modal-close-btn" class="modal-close-btn" type="button" aria-label="닫기">✕</button>
        </div>
      </div>
      <div class="modal-input-box">
        <input type="text" id="quote-add-input" placeholder="추가할 대사를 입력하세요" autocomplete="off">
        <button id="quote-add-submit-btn" type="button">등록</button>
      </div>
    </div>
  </div>

  <div id="quote-edit-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card modal-card-edit" role="dialog" aria-modal="true" aria-labelledby="quote-edit-modal-title">
      <div class="modal-header">
        <span id="quote-edit-modal-title">대사 수정</span>
        <button id="quote-edit-modal-close-btn" class="modal-close-btn" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="modal-input-box">
        <input type="text" id="quote-edit-input" placeholder="수정할 대사를 입력하세요" autocomplete="off">
        <button id="quote-edit-submit-btn" type="button">수정</button>
      </div>
    </div>
  </div>

  <div id="expression-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="expression-modal-title">
      <div class="modal-header">
        <span id="expression-modal-title">표정 목록 관리</span>
        <button id="expression-modal-close-btn" class="modal-close-btn" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="expression-input-box">
        <input type="text" id="exp-name-input" placeholder="표정 이름 (예: 웃음)" autocomplete="off">
        <input type="url" id="exp-url-input" placeholder="이미지 URL 링크" autocomplete="off">
        <button id="add-expression-btn" type="button">등록</button>
      </div>
      <ul id="expression-list" class="modal-body"></ul>
    </div>
  </div>

  <div id="expression-edit-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card modal-card-short" role="dialog" aria-modal="true" aria-labelledby="expression-edit-modal-title">
      <div class="modal-header">
        <span id="expression-edit-modal-title">표정 정보 수정</span>
        <button id="exp-edit-modal-close-btn" class="modal-close-btn" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="modal-input-box">
        <input type="text" id="exp-edit-name-input" placeholder="표정 이름" autocomplete="off">
        <input type="url" id="exp-edit-url-input" placeholder="이미지 URL 링크" autocomplete="off">
        <button id="exp-edit-submit-btn" type="button">수정</button>
      </div>
    </div>
  </div>

  <div id="expression-select-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card modal-card-select" role="dialog" aria-modal="true" aria-labelledby="expression-select-title">
      <div class="modal-header">
        <span id="expression-select-title">표정 선택</span>
        <button id="exp-select-close-btn" class="modal-close-btn" type="button" aria-label="닫기">✕</button>
      </div>
      <ul id="expression-select-list" class="modal-body"></ul>
    </div>
  </div>

  <div id="worldview-select-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card modal-card-select" role="dialog" aria-modal="true" aria-labelledby="worldview-select-title">
      <div class="modal-header">
        <span id="worldview-select-title">세계관 선택</span>
        <button id="worldview-select-close-btn" class="modal-close-btn" type="button" aria-label="닫기">✕</button>
      </div>
      <ul id="worldview-select-list" class="modal-body"></ul>
    </div>
  </div>

  <div id="item-detail-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card modal-card-item" role="dialog" aria-modal="true" aria-labelledby="item-detail-modal-title">
      <div class="modal-header">
        <span id="item-detail-modal-title">아이템 정보</span>
        <button id="item-detail-close-btn" class="modal-close-btn" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="item-modal-content">
        <img id="item-detail-img" class="item-modal-img" src="" alt="아이템">
        <div id="item-detail-name" class="item-modal-name"></div>
        <div id="item-detail-desc" class="item-modal-desc"></div>
      </div>
    </div>
  </div>

  <div id="item-select-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card modal-card-select" role="dialog" aria-modal="true" aria-labelledby="item-select-title">
      <div class="modal-header">
        <span id="item-select-title">아이템 선택</span>
        <button id="item-select-close-btn" class="modal-close-btn" type="button" aria-label="닫기">✕</button>
      </div>
      <ul id="item-select-list" class="modal-body"></ul>
    </div>
  </div>

  <div id="worldview-list-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="worldview-list-modal-title">
      <div class="modal-header">
        <span id="worldview-list-modal-title">세계관 목록</span>
        <button id="worldview-list-close-btn" class="modal-close-btn" type="button" aria-label="닫기">✕</button>
      </div>
      <ul id="worldview-list" class="modal-body"></ul>
    </div>
  </div>

  <div id="worldview-add-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card modal-card-edit" role="dialog" aria-modal="true" aria-labelledby="worldview-add-modal-title">
      <div class="modal-header">
        <span id="worldview-add-modal-title">세계관 추가</span>
        <button id="worldview-add-close-btn" class="modal-close-btn" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="modal-input-box">
        <input type="text" id="worldview-add-input" placeholder="추가할 세계관 이름을 입력하세요" autocomplete="off">
        <button id="worldview-add-submit-btn" type="button">등록</button>
      </div>
    </div>
  </div>

  <div id="worldview-edit-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card modal-card-edit" role="dialog" aria-modal="true" aria-labelledby="worldview-edit-modal-title">
      <div class="modal-header">
        <span id="worldview-edit-modal-title">세계관 이름 수정</span>
        <button id="worldview-edit-close-btn" class="modal-close-btn" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="modal-input-box">
        <input type="text" id="worldview-edit-input" placeholder="세계관 이름" autocomplete="off">
        <button id="worldview-edit-submit-btn" type="button">수정</button>
      </div>
    </div>
  </div>

  <div id="worldview-image-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card modal-card-short" role="dialog" aria-modal="true" aria-labelledby="worldview-image-modal-title">
      <div class="modal-header">
        <span id="worldview-image-modal-title">세계관 기본 이미지</span>
        <button id="worldview-image-close-btn" class="modal-close-btn" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="modal-input-box">
        <label class="worldview-field">
          <span>콜 기본 이미지</span>
          <input type="url" id="worldview-image-cole-input" placeholder="비우면 원래 기본 이미지" autocomplete="off">
        </label>
        <label class="worldview-field">
          <span>엘리 기본 이미지</span>
          <input type="url" id="worldview-image-ellie-input" placeholder="비우면 원래 기본 이미지" autocomplete="off">
        </label>
        <button id="worldview-image-submit-btn" type="button">저장</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>

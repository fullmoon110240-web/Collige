<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콜리지 놀이 (웹 버전)</title>
  <!-- Supabase CDN 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --cole-color: #3f548a;
      --ellie-color: #a04d53;
      --bg-color: #f7f9fc;
      --card-bg: #ffffff;
      --text-main: #333333;
      --border-light: #e2e8f0;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ================= 로딩 오버레이 ================= */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    .loading-overlay.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-card {
      text-align: center;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border-light);
      border-top: 4px solid var(--cole-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .loading-message {
      font-size: 13px;
      color: #666;
    }

    /* ================= 커서 이미지 ================= */
    .cursor-image.hidden {
      display: none;
    }

    /* ================= 캐릭터 영역 ================= */
    .shimeji-section {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 30px;
      width: 100%;
      max-width: 800px;
      margin-top: 40px;
    }

    .character-side-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .shimeji-avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--card-bg);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 4px solid transparent;
    }
    .shimeji-avatar:hover {
      transform: scale(1.05) translateY(-5px);
    }
    #shimeji-cole { border-color: var(--cole-color); }
    #shimeji-ellie { border-color: var(--ellie-color); }
    
    .shimeji-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-btn-group {
      display: flex;
      gap: 10px;
    }

    .action-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--card-bg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-size: 16px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .action-icon-btn:hover {
      background: #f0f0f0;
      transform: translateY(-2px);
    }

    /* ================= 말풍선 영역 ================= */
    .speech-bubble-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-width: 220px;
      position: relative;
      min-height: 130px;
    }

    .guide-bubble {
      position: absolute;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      color: #666;
      transition: opacity 0.5s ease;
    }
    .guide-bubble.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .speech-bubble-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .speech-bubble-box {
      display: none;
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      font-size: 14px;
      font-weight: 500;
      max-width: 200px;
      word-break: keep-all;
      text-align: center;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #bubble-cole { border: 2px solid var(--cole-color); color: var(--cole-color); }
    #bubble-ellie { border: 2px solid var(--ellie-color); color: var(--ellie-color); }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ================= 아이템 영역 ================= */
    .item-container {
      display: flex;
      gap: 15px;
      background: var(--card-bg);
      padding: 15px 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-top: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .item-btn {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      overflow: hidden;
      cursor: grab;
      border: 2px solid var(--border-light);
      transition: all 0.2s ease;
      background: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      box-sizing: border-box;
    }
    .item-btn:active { cursor: grabbing; }
    .item-btn:hover {
      border-color: #aaa;
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .item-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ================= 모달 (공통) ================= */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
      box-sizing: border-box;
    }

    .modal-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 450px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      max-height: 80vh;
      overflow: hidden;
      animation: slideUp 0.3s ease;
      box-sizing: border-box;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      font-weight: 700;
      font-size: 16px;
      background: #fcfcfc;
    }

    .modal-header-btns {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .header-action-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      background: var(--cole-color);
      color: white;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .header-action-btn:hover { opacity: 0.9; }

    .modal-close-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      color: #888;
      cursor: pointer;
      padding: 4px;
    }
    .modal-close-btn:hover { color: #333; }

    .modal-body {
      list-style: none;
      margin: 0;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ================= 대사 & 표정 리스트 ================= */
    .quote-row, .expression-item, .expression-select-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f9fb;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      gap: 12px;
    }
    
    .quote-text {
      flex: 1;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-all;
    }

    .quote-actions, .expression-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .quote-tag-btn, .quote-action-btn, .delete-btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .default-tag { background: #e2e8f0; color: #555; }
    .default-tag:hover { background: #cbd5e1; }
    
    .cole-tag { background: #ebf0f9; border: 1px solid var(--cole-color); color: var(--cole-color); }
    .ellie-tag { background: #fdf2f3; border: 1px solid var(--ellie-color); color: var(--ellie-color); }

    .quote-action-btn { background: #f1f5f9; color: #475569; }
    .quote-action-btn:hover { background: #e2e8f0; }
    .edit-cole, .edit-ellie { background: #f1f5f9; color: #475569; }

    .delete-btn { background: #fee2e2; color: #ef4444; font-weight: bold; padding: 6px 8px; }
    .delete-btn:hover { background: #fca5a5; }

    /* ================= 입력폼 모달 ================= */
    .modal-input-box, .expression-input-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
    }

    .modal-input-box input, .expression-input-box input {
      padding: 12px 14px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .modal-input-box input:focus, .expression-input-box input:focus {
      border-color: var(--cole-color);
    }

    .modal-input-box button, .expression-input-box button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--cole-color);
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .modal-input-box button:hover, .expression-input-box button:hover { opacity: 0.9; }

    .ellie-theme-btn { background-color: var(--ellie-color) !important; }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #555;
      cursor: pointer;
    }

    /* ================= 아이템 상세 정보 ================= */
    .item-modal-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      text-align: center;
      gap: 12px;
    }
    .item-modal-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .item-modal-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }
    .item-modal-desc {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
      word-break: keep-all;
    }
  </style>
</head>

    let sharedQuotes = {};
    let characterExpressions = {};
    let currentActiveShimeji = null;
    let editingQuoteId = null;
    let editingExpId = null;
    let tempQuoteTextToAdd = "";

    document.addEventListener('DOMContentLoaded', async () => {
      await loadDataFromSupabase();
      initModal();
      initCharacters();
      initItems();
      document.getElementById('loading-overlay').classList.add('is-hidden');
    });

    // Supabase 데이터 로드
    async function loadDataFromSupabase() {
      try {
        const { data: quotesData } = await supabaseClient.from('quotes').select('*');
        const { data: expsData } = await supabaseClient.from('expressions').select('*');

        sharedQuotes = {};
        characterExpressions = {};

        if (quotesData) {
          quotesData.forEach(q => {
            if (!sharedQuotes[q.character_id]) sharedQuotes[q.character_id] = [];
            sharedQuotes[q.character_id].push({
              id: q.id,
              text: q.text,
              image: q.image || '',
              imageTitle: q.image_title || '',
              itemName: q.item_name || ''
            });
          });
        }

        if (expsData) {
          expsData.forEach(e => {
            if (!characterExpressions[e.character_id]) characterExpressions[e.character_id] = [];
            characterExpressions[e.character_id].push({
              id: e.id,
              name: e.name,
              url: e.url
            });
          });
        }
      } catch (err) {
        console.error('데이터 로드 실패:', err);
        alert('데이터를 불러오는 중 오류가 발생했습니다.');
      }
    }

    // 캐릭터 클래스 정의
    class ShimejiCharacter {
      constructor(config) {
        this.id = config.id;
        this.name = config.name;
        this.element = document.getElementById(config.id);
        this.imgElement = document.getElementById(config.imgId);
        this.defaultImageSrc = this.imgElement ? this.imgElement.src : "";
        this.bubbleElement = document.getElementById(config.bubbleId);
        this.otherBubbleElement = document.getElementById(config.otherBubbleId);
        this.init();
      }

      init() {
        if (this.element) {
          this.element.addEventListener('click', () => this.speakRandomQuote());
        }
        document.getElementById(this.id === 'shimeji-cole' ? 'btn-cole' : 'btn-ellie').addEventListener('click', (e) => {
          e.stopPropagation();
          openQuoteAddModal(this);
        });
        document.getElementById(this.id === 'shimeji-cole' ? 'list-btn-cole' : 'list-btn-ellie').addEventListener('click', (e) => {
          e.stopPropagation();
          openQuoteModal(this);
        });
      }

      getQuotes() { return Array.isArray(sharedQuotes[this.id]) ? sharedQuotes[this.id] : []; }

      speakRandomQuote() {
        const quotes = this.getQuotes();
        if (quotes.length === 0) { this.showBubble("등록된 대사가 없습니다."); return; }
        const q = quotes[Math.floor(Math.random() * quotes.length)];
        this.speakQuote(q);
      }

      speakQuote(q) {
        if (!q) return;
        this.showBubble(q.text);
        this.imgElement.src = q.image || this.defaultImageSrc;
      }

      showBubble(text) {
        if (this.otherBubbleElement) this.otherBubbleElement.style.display = 'none';
        if (this.bubbleElement) {
          this.bubbleElement.innerText = text;
          this.bubbleElement.style.display = 'block';
          setTimeout(() => {
            this.bubbleElement.style.display = 'none';
            this.imgElement.src = this.defaultImageSrc;
          }, 4000);
        }
      }

      reactToItem(itemName) {
        const quotes = this.getQuotes().filter(q => q.itemName === itemName);
        if (quotes.length > 0) {
          this.speakQuote(quotes[Math.floor(Math.random() * quotes.length)]);
        } else {
          this.showBubble(`${itemName}? 이게 뭐지?`);
        }
      }
    }

    let coleChar, ellieChar;
    function initCharacters() {
      coleChar = new ShimejiCharacter({ id: 'shimeji-cole', name: '콜', imgId: 'img-cole', bubbleId: 'bubble-cole', otherBubbleId: 'bubble-ellie' });
      ellieChar = new ShimejiCharacter({ id: 'shimeji-ellie', name: '엘리', imgId: 'img-ellie', bubbleId: 'bubble-ellie', otherBubbleId: 'bubble-cole' });
    }

    function initItems() {
      document.querySelectorAll('.item-btn').forEach(btn => {
        const itemId = btn.getAttribute('data-item-id');
        const info = itemDataDict[itemId];
        btn.addEventListener('click', () => {
          document.getElementById('item-detail-name').innerText = info.name + " 상세 정보";
          document.getElementById('item-detail-name-title').innerText = info.name;
          document.getElementById('item-detail-img').src = info.img;
          document.getElementById('item-detail-desc').innerText = info.desc;
          document.getElementById('item-detail-modal').style.display = 'flex';
        });
      });
    }

    // 모달 관리 및 CRUD 함수들
    function initModal() {
      document.getElementById('modal-close-btn').addEventListener('click', () => document.getElementById('quote-modal').style.display = 'none');
      document.getElementById('quote-add-modal-close-btn').addEventListener('click', () => document.getElementById('quote-add-modal').style.display = 'none');
      document.getElementById('quote-edit-modal-close-btn').addEventListener('click', () => document.getElementById('quote-edit-modal').style.display = 'none');
      document.getElementById('expression-modal-close-btn').addEventListener('click', () => document.getElementById('expression-modal').style.display = 'none');
      document.getElementById('exp-select-close-btn').addEventListener('click', () => document.getElementById('expression-select-modal').style.display = 'none');
      document.getElementById('item-select-close-btn').addEventListener('click', () => document.getElementById('item-select-modal').style.display = 'none');
      document.getElementById('item-detail-close-btn').addEventListener('click', () => document.getElementById('item-detail-modal').style.display = 'none');

      document.getElementById('expression-manage-btn').addEventListener('click', openExpressionModal);
      document.getElementById('quote-add-submit-btn').addEventListener('click', submitAddQuote);
      document.getElementById('quote-edit-submit-btn').addEventListener('click', submitEditQuote);
      document.getElementById('add-expression-btn').addEventListener('click', submitAddExpression);
    }

    function openQuoteModal(char) {
      currentActiveShimeji = char;
      document.getElementById('modal-title').innerText = `${char.name} 대사 목록`;
      renderModalQuoteList();
      document.getElementById('quote-modal').style.display = 'flex';
    }

    function renderModalQuoteList() {
      const list = document.getElementById('modal-quote-list');
      list.innerHTML = '';
      const quotes = currentActiveShimeji.getQuotes();

      if (quotes.length === 0) {
        list.innerHTML = '<li style="text-align:center; color:#aaa; padding:15px;">등록된 대사가 없습니다.</li>';
        return;
      }

      quotes.forEach((q) => {
        const li = document.createElement('li');
        li.className = 'quote-row';
        const tagThemeClass = currentActiveShimeji.id === 'shimeji-cole' ? 'cole-tag' : 'ellie-tag';
        li.innerHTML = `
          <span class="quote-text">${q.text}</span>
          <div class="quote-actions">
            <button class="quote-tag-btn ${q.itemName ? tagThemeClass : 'default-tag'}">${q.itemName || '기본'}</button>
            <button class="quote-tag-btn ${q.imageTitle ? tagThemeClass : 'default-tag'}" onclick="openExpressionSelect('${q.id}')">${q.imageTitle || '기본'}</button>
            <button class="quote-action-btn" onclick="openQuoteEdit('${q.id}', '${q.text}')">수정</button>
            <button class="delete-btn" onclick="deleteQuote('${q.id}')">✕</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    function openQuoteAddModal(char) {
      currentActiveShimeji = char;
      const isEllie = char.id === 'shimeji-ellie';
      
      const inputEl = document.getElementById('quote-add-input');
      const submitBtn = document.getElementById('quote-add-submit-btn');
      
      if (isEllie) {
        inputEl.classList.add('ellie-theme');
        submitBtn.classList.add('ellie-theme-btn');
      } else {
        inputEl.classList.remove('ellie-theme');
        submitBtn.classList.remove('ellie-theme-btn');
      }

      inputEl.value = '';
      document.getElementById('quote-add-item-checkbox').checked = false;
      document.getElementById('quote-add-modal').style.display = 'flex';
    }

    async function submitAddQuote() {
      const text = document.getElementById('quote-add-input').value.trim();
      const isItem = document.getElementById('quote-add-item-checkbox').checked;
      if (!text) return;

      let itemName = "";
      if (isItem) {
        itemName = "단검"; 
      }

      const { data, error } = await supabaseClient.from('quotes').insert([{
        character_id: currentActiveShimeji.id,
        text: text,
        item_name: itemName
      }]).select();

      if (!error && data) {
        if (!sharedQuotes[currentActiveShimeji.id]) sharedQuotes[currentActiveShimeji.id] = [];
        sharedQuotes[currentActiveShimeji.id].push({
          id: data[0].id,
          text: text,
          image: '',
          imageTitle: '',
          itemName: itemName
        });
        document.getElementById('quote-add-modal').style.display = 'none';
        alert('대사가 추가되었습니다!');
      } else {
        alert('추가 실패');
      }
    }

    function openQuoteEdit(id, text) {
      editingQuoteId = id;
      document.getElementById('quote-edit-input').value = text;
      document.getElementById('quote-edit-modal').style.display = 'flex';
    }

    async function submitEditQuote() {
      const newText = document.getElementById('quote-edit-input').value.trim();
      if (!newText || !editingQuoteId) return;

      const { error } = await supabaseClient.from('quotes').update({ text: newText }).eq('id', editingQuoteId);
      if (!error) {
        const quotes = currentActiveShimeji.getQuotes();
        const q = quotes.find(item => item.id === editingQuoteId);
        if (q) q.text = newText;
        document.getElementById('quote-edit-modal').style.display = 'none';
        renderModalQuoteList();
      } else {
        alert('수정 실패');
      }
    }

    async function deleteQuote(id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      const { error } = await supabaseClient.from('quotes').delete().eq('id', id);
      if (!error) {
        sharedQuotes[currentActiveShimeji.id] = sharedQuotes[currentActiveShimeji.id].filter(q => q.id !== id);
        renderModalQuoteList();
      } else {
        alert('삭제 실패');
      }
    }

    function openExpressionModal() {
      renderExpressionList();
      document.getElementById('expression-modal').style.display = 'flex';
    }

    function renderExpressionList() {
      const list = document.getElementById('expression-list');
      list.innerHTML = '';
      const exps = characterExpressions[currentActiveShimeji.id] || [];

      if (exps.length === 0) {
        list.innerHTML = '<li style="text-align:center; color:#aaa; padding:15px;">등록된 표정이 없습니다.</li>';
        return;
      }

      exps.forEach(e => {
        const li = document.createElement('li');
        li.className = 'expression-item';
        li.innerHTML = `<span class="quote-text">[${e.name}]</span> <button class="delete-btn" onclick="deleteExpression('${e.id}')">✕</button>`;
        list.appendChild(li);
      });
    }

    async function submitAddExpression() {
      const name = document.getElementById('exp-name-input').value.trim();
      const url = document.getElementById('exp-url-input').value.trim();
      if (!name || !url) { alert('이름과 URL을 모두 입력해주세요.'); return; }

      const { data, error } = await supabaseClient.from('expressions').insert([{
        character_id: currentActiveShimeji.id, name: name, url: url
      }]).select();

      if (!error && data) {
        if (!characterExpressions[currentActiveShimeji.id]) characterExpressions[currentActiveShimeji.id] = [];
        characterExpressions[currentActiveShimeji.id].push({ id: data[0].id, name: name, url: url });
        document.getElementById('exp-name-input').value = '';
        document.getElementById('exp-url-input').value = '';
        renderExpressionList();
      } else {
        alert('표정 추가 실패');
      }
    }

    async function deleteExpression(id) {
      if (!confirm('표정을 삭제하시겠습니까?')) return;
      const { error } = await supabaseClient.from('expressions').delete().eq('id', id);
      if (!error) {
        characterExpressions[currentActiveShimeji.id] = characterExpressions[currentActiveShimeji.id].filter(e => e.id !== id);
        renderExpressionList();
      } else {
        alert('삭제 실패');
      }
    }
  </script>
